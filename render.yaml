services:
  - type: web
    name: ventureforge-backend
    runtime: python
    plan: free
    rootDir: .
    buildCommand: pip install -r backend/requirements.txt
    startCommand: cd backend && alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/v1/system/status
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.6
      - key: APP_ENV
        value: production
      - key: LOG_LEVEL
        value: INFO
      - key: API_V1_PREFIX
        value: /api/v1
      - key: DATABASE_URL
        fromDatabase:
          name: ventureforge-db
          property: connectionString
      # Set to the real deployed Vercel domain(s), comma-separated, e.g.
      # https://ventureforge-ai.vercel.app,https://ventureforge-ai-<hash>.vercel.app
      - key: BACKEND_CORS_ORIGINS
        sync: false
      # Optional — the Judge Agent works fully deterministically without this.
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-flash-latest
      - key: MODEL_DIR
        value: ../ml/models

databases:
  - name: ventureforge-db
    plan: free
    databaseName: ventureforge_ai
    user: ventureforge
